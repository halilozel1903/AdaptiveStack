<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="AdaptiveStack: sidebar, content, detail and inspector columns that reflow on iPad and Mac" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#111a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="280" r="320" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="222" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="-1.5">AdaptiveStack</text>
    <text x="74" y="274" fill="#cbd5e1" font-size="26" font-weight="500">Columns that reflow on iPad and Mac</text>
    <text x="74" y="310" fill="#94a3b8" font-size="19">Sidebar · content · detail · inspector, with state restoration</text>
    <g font-size="19" font-weight="600">
      <rect x="74" y="342" width="116" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="132" y="367" fill="#e2e8f0" text-anchor="middle">SwiftUI</text>
      <rect x="202" y="342" width="148" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="276" y="367" fill="#e2e8f0" text-anchor="middle">iPadOS 17+</text>
      <rect x="362" y="342" width="140" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="432" y="367" fill="#e2e8f0" text-anchor="middle">macOS 14+</text>
      <rect x="514" y="342" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="568" y="367" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
    </g>
  </g>

  <!-- Wide: four columns in a window -->
  <g filter="url(#shadow)">
    <rect x="660" y="78" width="560" height="340" rx="18" fill="#1b2240" stroke="#ffffff" stroke-opacity="0.16"/>
  </g>
  <circle cx="684" cy="100" r="6" fill="#ff5f57"/>
  <circle cx="704" cy="100" r="6" fill="#febc2e"/>
  <circle cx="724" cy="100" r="6" fill="#28c840"/>
  <!-- sidebar -->
  <rect x="672" y="118" width="112" height="288" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="684" y="134" width="88" height="22" rx="6" fill="url(#accent)"/>
  <rect x="684" y="168" width="70" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6"/>
  <rect x="684" y="192" width="80" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6"/>
  <rect x="684" y="216" width="60" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6"/>
  <rect x="684" y="240" width="74" height="10" rx="5" fill="#94a3b8" fill-opacity="0.6"/>
  <!-- content -->
  <rect x="794" y="118" width="134" height="288" rx="10" fill="#ffffff" fill-opacity="0.04"/>
  <g fill="#cbd5e1" fill-opacity="0.55">
    <rect x="806" y="136" width="96" height="10" rx="5"/>
    <rect x="806" y="152" width="60" height="7" rx="3.5" fill-opacity="0.35"/>
    <rect x="806" y="214" width="88" height="10" rx="5"/>
    <rect x="806" y="230" width="54" height="7" rx="3.5" fill-opacity="0.35"/>
    <rect x="806" y="254" width="100" height="10" rx="5"/>
    <rect x="806" y="270" width="64" height="7" rx="3.5" fill-opacity="0.35"/>
  </g>
  <rect x="800" y="168" width="122" height="38" rx="8" fill="#3b82f6" fill-opacity="0.45"/>
  <rect x="810" y="178" width="90" height="10" rx="5" fill="#ffffff"/>
  <rect x="810" y="193" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.6"/>
  <!-- detail -->
  <rect x="940" y="136" width="150" height="16" rx="6" fill="#f8fafc"/>
  <rect x="940" y="162" width="52" height="16" rx="8" fill="#f97316" fill-opacity="0.35"/>
  <rect x="998" y="162" width="44" height="16" rx="8" fill="#60a5fa" fill-opacity="0.35"/>
  <g fill="#cbd5e1" fill-opacity="0.4">
    <rect x="940" y="194" width="140" height="8" rx="4"/>
    <rect x="940" y="210" width="128" height="8" rx="4"/>
    <rect x="940" y="226" width="110" height="8" rx="4"/>
  </g>
  <rect x="940" y="252" width="140" height="92" rx="10" fill="#ffffff" fill-opacity="0.05"/>
  <g fill="#22c55e"><circle cx="954" cy="270" r="5"/><circle cx="954" cy="292" r="5"/></g>
  <g fill="none" stroke="#94a3b8" stroke-width="1.5"><circle cx="954" cy="314" r="5"/><circle cx="954" cy="334" r="5"/></g>
  <g fill="#cbd5e1" fill-opacity="0.45">
    <rect x="966" y="266" width="96" height="8" rx="4"/>
    <rect x="966" y="288" width="80" height="8" rx="4"/>
    <rect x="966" y="310" width="100" height="8" rx="4"/>
    <rect x="966" y="330" width="70" height="8" rx="4"/>
  </g>
  <!-- inspector -->
  <rect x="1100" y="118" width="108" height="288" rx="10" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <g fill="#c4b5fd" fill-opacity="0.75">
    <rect x="1112" y="136" width="50" height="8" rx="4"/>
    <rect x="1112" y="176" width="40" height="8" rx="4"/>
    <rect x="1112" y="216" width="56" height="8" rx="4"/>
  </g>
  <g fill="#e2e8f0" fill-opacity="0.55">
    <rect x="1112" y="152" width="84" height="10" rx="5"/>
    <rect x="1112" y="192" width="74" height="10" rx="5"/>
    <rect x="1112" y="232" width="84" height="10" rx="5"/>
    <rect x="1112" y="268" width="84" height="10" rx="5"/>
  </g>

  <!-- Arrow: reflow -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M940 438 C940 470 916 480 890 480"/>
    <path d="M898 470 l-9 10 l10 8"/>
  </g>
  <text x="954" y="476" fill="#94a3b8" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16">reflows by size class</text>

  <!-- Compact: one column in a stack -->
  <g filter="url(#shadow)">
    <rect x="752" y="436" width="126" height="108" rx="16" fill="#1b2240" stroke="#ffffff" stroke-opacity="0.16"/>
  </g>
  <path d="M770 458 l-6 6 l6 6" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="780" y="459" width="44" height="10" rx="5" fill="#60a5fa" fill-opacity="0.6"/>
  <rect x="766" y="482" width="96" height="12" rx="6" fill="#f8fafc"/>
  <g fill="#cbd5e1" fill-opacity="0.4">
    <rect x="766" y="504" width="90" height="7" rx="3.5"/>
    <rect x="766" y="518" width="74" height="7" rx="3.5"/>
  </g>
</svg>
