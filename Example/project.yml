name: AdaptiveStackDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  AdaptiveStack:
    path: ..
targets:
  AdaptiveStackDemoPad:
    type: application
    platform: iOS
    sources:
      - Shared
      - Pad
    dependencies:
      - package: AdaptiveStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.AdaptiveStackDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
  AdaptiveStackDemoMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: AdaptiveStack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.AdaptiveStackDemo.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Halil Özel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
schemes:
  AdaptiveStackDemoPad:
    build:
      targets:
        AdaptiveStackDemoPad: all
    run:
      config: Debug
  AdaptiveStackDemoMac:
    build:
      targets:
        AdaptiveStackDemoMac: all
    run:
      config: Debug
